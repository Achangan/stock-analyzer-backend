      discovery:
        server-addr: localhost:8848

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

logging:
  level:
    com.stockanalyzer: debug
    com.stockanalyzer.analysis.feign: debug
